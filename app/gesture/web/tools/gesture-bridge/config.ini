# gesture-bridge 配置（改完重启程序生效）
# 串口号： python gesture_bridge.py --list-ports

[serial]
port = COM9
baudrate = 115200
reconnect_ms = 1000

[gesture]
# 手势 = 网页指令。指令只能是 START / FIST / POINT / MODE / CONFIRM / ULTIMATE / RESET，
# 写 IGNORE 表示这个手势不做动作。
# 默认按网页文档里的手势名对应：张开手掌=START、握拳=FIST、V 字=MODE。
paper = START
rock = FIST
scissors = MODE

# 手离开取景框多久之后发"空画面"指令，让页面退回待机。
# 指令写 IGNORE 表示不做这件事（页面就会一直停在最后一个手势上）。
idle_command = IDLE

[hold]
# 一个手势 = 一个状态：保持 short_ms 进状态，继续到 long_ms 放这个状态的第二招。
# 界面 GESTURE 下面会显示状态名 + 进度条。
short_ms = 200
long_ms = 900
# <手势>_state = 状态名；<手势>_long = 长按触发的指令（IGNORE = 没有第二招）
rock_state = 蓄力
rock_long = ULTIMATE
paper_state = 启动
paper_long = CONFIRM
scissors_state = 模型
scissors_long = POINT


[timing]
# 连续几行（板子 10 Hz）一致才发指令：3 行约 0.3 秒
confirm_reports = 3
# 两条指令之间的最小间隔（网页自己还有一层冷却）。
cooldown_ms = 800
# 静默这么久没有任何行 = 手已离开，重新上膛。
report_gap_ms = 500
# 手离开多久之后发 idle_command（从最后一个手势行算起）。
idle_after_ms = 1200

[server]
host = 127.0.0.1
port = 8765
